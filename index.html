<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090d">
<title>TecnISAC</title>
<style>
:root{--bg:#080d12;--panel:#111a22;--panel2:#17232d;--ink:#f0f5f7;--muted:#9aabb5;--line:#293945;--accent:#32d4b5;--accentink:#04221c;--warn:#f6c85f}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:760px;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:#0b1218;gap:10px;position:relative}h1{margin:0;font-size:1.2rem;letter-spacing:.02em}header p{margin:2px 0 0;color:var(--muted);font-size:.82rem}.brandmark{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#32d4b5,#0d766b);display:grid;place-items:center;color:#03231d;font-size:22px;font-weight:900}.gear{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:42px;height:42px;font-size:20px}#cfg{position:absolute;z-index:4;right:12px;top:62px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:12px;min-width:190px;box-shadow:0 10px 30px #0008}#cfg[hidden]{display:none}#cfg button{margin-top:8px;width:100%;padding:10px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px}#chat{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.msg{max-width:100%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.me{align-self:flex-end;max-width:88%;background:#126e61;color:#fff;border-bottom-right-radius:4px}.bot{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}.welcome{padding:18px;background:linear-gradient(135deg,#122c31,#111a22);border:1px solid #23564f;border-radius:16px}.welcome h2{margin:0 0 6px;font-size:1.12rem}.welcome p{margin:0;color:#c3d4d9}.chips{display:flex;gap:8px;padding:8px 14px;overflow-x:auto;flex:none}.chips button{flex:none;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:inherit;font-size:.85rem}.row{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b1218;flex:none}#q{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:13px;font:inherit;outline:none}#q:focus{border-color:var(--accent)}.send,.att{border:0;border-radius:12px;background:var(--accent);color:var(--accentink);padding:0 16px;min-height:46px;font:inherit;font-weight:800}.att{display:grid;place-items:center;background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-size:23px;width:46px;padding:0;cursor:pointer}.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.cardtitle{font-size:1rem;font-weight:800;margin-bottom:8px}.pill{display:inline-block;background:#203b40;color:#7fe9d5;border-radius:6px;padding:3px 7px;font-size:.75rem;margin:0 4px 5px 0}.section{margin-top:12px}.section h3{margin:0 0 7px;color:var(--accent);font-size:.88rem}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:27px 1fr;gap:9px;padding:9px;background:var(--panel2);border-radius:10px}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#24534d;color:#9ff5e5;font-weight:800}.partlist{display:grid;grid-template-columns:1fr;gap:7px}.part{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px}.part strong{font-size:.88rem}.part span{font-size:.82rem;color:var(--muted);text-align:right}.notice{margin-top:12px;padding:10px;border-left:3px solid var(--warn);background:#2a2518;color:#f6e4b0;border-radius:5px;font-size:.84rem}.filepreview{max-width:160px;max-height:150px;border-radius:9px;display:block;margin-bottom:7px}.small{font-size:.8rem;color:var(--muted)}@media(min-width:600px){.partlist{grid-template-columns:1fr 1fr}}#splash{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .18s}#splash.sai{opacity:0;pointer-events:none}#splash img{width:min(94vw,720px);max-height:85vh;object-fit:contain;animation:lionwalk 1s ease-in-out both}@keyframes lionwalk{0%{transform:translateX(-10vw);opacity:.4}100%{transform:translateX(0);opacity:1}}@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
html[data-bw]{--bg:#000;--panel:#000;--panel2:#000;--ink:#fff;--muted:#fff;--line:#fff;--accent:#fff;--accentink:#000;--warn:#fff}
html[data-bw=white]{--bg:#fff;--panel:#fff;--panel2:#fff;--ink:#000;--muted:#000;--line:#000;--accent:#000;--accentink:#fff;--warn:#000}
html[data-bw] *{background:var(--bg)!important;color:var(--ink)!important;border-color:var(--line)!important;box-shadow:none!important}
html[data-bw] .me,html[data-bw] .send,html[data-bw] .logo{background:var(--ink)!important;color:var(--bg)!important}
html[data-bw] .me *,html[data-bw] .send *,html[data-bw] .logo *{background:transparent!important;color:var(--bg)!important}
#ov input,#ov select,#ov textarea{display:block;width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid var(--line);font:inherit}
#ov button{margin:6px 6px 6px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font:inherit}
</style>
</head>
<body>
<div id="splash" aria-label="Ecrã inicial TecnISAC">
  <img alt="Leão branco a caminhar" src="...">
</div>
</body>
</html>
